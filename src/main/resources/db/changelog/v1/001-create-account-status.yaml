databaseChangeLog:
  - changeSet:
      id: 001-create-account-status
      author: grishenkov
      changes:
        - createTable:
            tableName: account_status
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: VARCHAR(255)